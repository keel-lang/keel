name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        run: |
          cargo install mdbook --version "^0.5"
          cargo install mdbook-mermaid

      - name: Build mdbook-keel-catalog
        run: cargo build -p mdbook-keel-catalog

      - name: Add mdbook-keel-catalog to PATH
        run: echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Build docs
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/v\1/')
          sed -i "s/%%VERSION%%/$VERSION/g" docs/src/introduction.md
          cd docs && mdbook-mermaid install . && mdbook build
          echo "keel-lang.dev" > ../target/book/CNAME
          cp ../install.sh   ../target/book/install.sh
          cp ../uninstall.sh ../target/book/uninstall.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
