name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch
# (or PR). `head_ref` is the source branch on pull_request events; on push it
# is empty, so we fall back to `ref` (e.g. refs/heads/main).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cache the cargo registry and the target/ directory across runs. The
      # expensive part of CI is compiling the dependency graph (tokio, hyper,
      # reqwest, axum, lettre, …) in both the debug and release profiles; on a
      # warm cache those artifacts are restored instead of rebuilt, so only the
      # workspace crates recompile. rust-cache keys on the lockfile and rustc
      # version and evicts the (cheap) workspace artifacts to keep the cache lean.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # No --all-features here: `build-backend` (keel-codegen, LLVM) is
      # exercised by its own job below so this job — and every ordinary
      # contributor's `keel run`/`check`/`lsp` workflow — never needs LLVM
      # installed (designs/llvm-compilation.md §2.2, §5 risks).
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --document-private-items

      # On PRs, only verify the release profile still type/borrow-checks — a few
      # seconds, vs. ~2 min for the full opt-3 + fat-LTO build. The optimized
      # binary feeds nothing else in CI (tests use the debug binary), and there
      # is no release-divergent code, so this catches the same compile errors.
      - name: Check release profile compiles
        if: github.event_name == 'pull_request'
        run: cargo check --release

      # On push to main (and manual dispatch), do the full optimized build so a
      # release-only link/codegen failure surfaces before it reaches a release.
      - name: Build release binary
        if: github.event_name != 'pull_request'
        run: cargo build --release

      - name: Run tests
        run: cargo test

  # Exercises the `build-backend` feature (keel-codegen, LLVM/inkwell) in
  # isolation so the LLVM toolchain install never touches the `check` job
  # above — see designs/llvm-compilation.md §2.2 and §5 risks, and the
  # verified install recipe in designs/llvm-toolchain-spike.md.
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # LLVM 22 via apt.llvm.org's official install script — the same
      # recipe proved working (object emission + link + run) for both
      # platforms in designs/llvm-toolchain-spike.md. `llvm.sh` alone is not
      # sufficient: llvm-sys statically links Polly, which needs the
      # separate libpolly-*-dev package.
      - name: Install LLVM 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install -y libpolly-22-dev zlib1g-dev libzstd-dev

      - name: Build workspace with build-backend
        env:
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
        run: cargo build --workspace --features build-backend

      - name: Run Clippy (build-backend)
        env:
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
        run: cargo clippy --workspace --all-targets --features build-backend -- -D warnings

      - name: Run tests (build-backend)
        env:
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
        run: cargo test --workspace --features build-backend
