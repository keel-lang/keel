name: Cut minor release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next minor version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          version="${latest#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          next_minor=$((minor + 1))
          echo "tag=v${major}.${next_minor}.0" >> "$GITHUB_OUTPUT"

      - name: Push tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
