[workspace]
members = ["crates/*", "tools/mdbook-keel-catalog"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
logos = "0.16"
chumsky = "0.13"
miette = { version = "7", features = ["fancy"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
parking_lot = "0.12"
tempfile = "3"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
regex = "1"
glob = "0.3"
csv = "1"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"
style = "warn"
complexity = "warn"

[package]
name = "keel-lang"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keel — a programming language where AI agents are first-class citizens"
repository = "https://github.com/keel-lang/keel"
homepage = "https://github.com/keel-lang/keel"
readme = "README.md"
keywords = ["language", "ai", "agents", "llm", "interpreter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["target/", "docs/", ".claude/"]

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
# `keel-codegen` links LLVM (inkwell); everything else in the workspace stays
# LLVM-free. See crates/keel-codegen/README.md for the toolchain requirement.
build-backend = ["dep:keel-codegen"]

[dependencies]
keel-catalog = { path = "crates/keel-catalog" }
keel-codegen = { path = "crates/keel-codegen", optional = true }
keel-compiler = { path = "crates/keel-compiler" }
keel-dap = { path = "crates/keel-dap" }
keel-kir = { path = "crates/keel-kir" }
keel-runtime = { path = "crates/keel-runtime" }
keel-syntax = { path = "crates/keel-syntax" }
# The heavy I/O dependencies (reqwest, rusqlite, axum, lettre, imap, native-tls,
# …) now live in keel-runtime; keel-lang links them transitively and only
# declares what its own facade/binary code (CLI, REPL, LSP, session) uses.
logos = { workspace = true }
clap = { version = "4", features = ["derive"] }
miette = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
colored = { workspace = true }
rustyline = "18"
tower-lsp = "0.20"
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used only by the integration tests that exercise the email/csv/search namespaces.
regex = { workspace = true }
glob = { workspace = true }
csv = { workspace = true }
# Used only by tests/conformance/ to redirect fd 1 around an in-process engine
# run so `println!`-based namespace output (io.print, log.*, …) can be
# captured and diffed without shelling out to a subprocess. Already in the
# dependency tree transitively (via miette/backtrace); this just names it
# directly for the one call site that needs raw dup/dup2.
libc = "0.2"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

