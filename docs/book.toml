[book]
title = "The Keel Language"
authors = ["Zied Maktouf"]
description = "Documentation for Keel — a programming language where AI agents are first-class citizens"
language = "en"
src = "src"

[build]
build-dir = "../target/book"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.keel-catalog]
command = "mdbook-keel-catalog"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/keel-lang/keel"
edit-url-template = "https://github.com/keel-lang/keel/edit/main/docs/{path}"
site-url = "https://keel-lang.dev/"
additional-css = ["theme/keel-docs.css"]
additional-js = ["mermaid-init.js", "theme/keel-theme-picker.js", "theme/keel-pagetoc.js", "theme/keel-callouts.js"]

[output.html.fold]
enable = true
level = 1
